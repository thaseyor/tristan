[package]
name = "tristan"
description = "Telegram bot that deletes join/leave system messages"
version = "2.0.0"
edition = "2021"
authors = ["thaseyor"]
license = "MIT"
repository = "https://github.com/thaseyor/tristan.git"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dotenvy = "0.15.7"
log = "0.4.34"
pretty_env_logger = "0.5.0"
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
